<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1b1a">
<title>Finanzen</title>
<style>
  :root { --bg: #f6f3ef; --text: #1c1b1a; --gedimmt: #6b6560; --akzent: #b5562f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1b1a; --text: #f0ece6; --gedimmt: #a39c94; --akzent: #d9774b; } }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 16px 24px; }
  h1 { font-size: 26px; margin: 0 0 8px; } h1 span { color: var(--akzent); }
  p { color: var(--gedimmt); margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>Finanzen <span>·</span> Handy</h1>
  <p>Die Handy-Ansicht wird gerade gebaut.</p>
  <p>Kern-Bot · Raster-Bot · Trend-Bot · Nachrichten</p>
</main>
</body>
</html>
